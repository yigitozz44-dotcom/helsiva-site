<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Helsiva Admin</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F4F1EB;--paper:#FBFAF7;--sand:#D8D0C3;--taupe:#A69D90;--ink:#242524;--black:#111211;--forest:#475249;--red:#A33A32;--gold:#B79A5B;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--ivory);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
/* login */
#login{min-height:100vh;display:grid;place-items:center;background:var(--black);color:var(--ivory);text-align:center;padding:24px}
#login svg{width:54px;height:62px;margin-bottom:18px}
#login h1{font:300 40px var(--serif);letter-spacing:.3em;margin:0 0 6px;padding-left:.3em}
#login p{opacity:.6;letter-spacing:.2em;text-transform:uppercase;font-size:11px;margin:0 0 36px}
.btn{border:1px solid currentColor;background:none;padding:13px 26px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:.2s}
.btn:hover{opacity:.75}
.btn.solid{background:var(--ivory);color:var(--black);border-color:var(--ivory)}
.btn.dark{background:var(--black);color:var(--ivory);border-color:var(--black)}
.btn[disabled]{opacity:.35;cursor:default}
#pw{display:block;width:260px;max-width:100%;margin:0 auto 14px;background:transparent;border:1px solid rgba(244,241,235,.35);color:var(--ivory);padding:13px 14px;font:14px var(--sans);letter-spacing:.08em;text-align:center;outline:0}#pw:focus{border-color:var(--ivory)}#err{color:#e29a93;margin-top:22px;min-height:20px;font-size:13px}
/* header */
header{position:sticky;top:0;z-index:30;background:var(--black);color:var(--ivory);display:flex;align-items:center;gap:28px;padding:0 24px;height:72px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;white-space:nowrap}
.logo svg{height:34px;width:auto}
.logo b{font:400 22px var(--serif);letter-spacing:.3em}
.logo i{font:400 10px var(--sans);letter-spacing:.3em;border:1px solid rgba(244,241,235,.4);padding:3px 7px;margin-left:4px;font-style:normal}
nav{display:flex;gap:6px;margin:0 auto;height:100%}
nav button{background:none;border:0;color:inherit;padding:0 20px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;height:100%;position:relative;opacity:.8}
nav button:hover,nav button.on{opacity:1}
nav button.on:after{content:"";position:absolute;left:20px;right:20px;bottom:18px;height:1px;background:var(--ivory)}
.hr{display:flex;align-items:center;gap:14px;white-space:nowrap}
.hr a,.hr .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;text-decoration:none}
.hr a:hover{opacity:1}
#pub{background:var(--ivory);color:var(--black);border:0;padding:11px 20px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
#pub[disabled]{background:transparent;color:rgba(244,241,235,.4);border:1px solid rgba(244,241,235,.25);cursor:default}
#dis{background:none;border:0;color:var(--ivory);opacity:.7;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-decoration:underline}
/* mega */
#mega{position:fixed;left:0;right:0;top:72px;background:var(--black);color:var(--ivory);z-index:29;padding:30px 24px 36px;border-top:1px solid rgba(244,241,235,.12);display:none}
#mega.on{display:block}
.mg{display:flex;gap:64px;justify-content:center;flex-wrap:wrap}
.mc h4{font:400 24px var(--serif);margin:0 0 12px}
.mc button{display:flex;justify-content:space-between;gap:30px;width:100%;min-width:200px;background:none;border:0;color:inherit;text-align:left;padding:6px 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.mc button:hover{opacity:1}
.mc button span{opacity:.5}
.mc h4 button{font:400 24px var(--serif);text-transform:none;letter-spacing:0;padding:0;opacity:1;display:inline}
#band{background:var(--black);color:var(--ivory);border-top:1px solid rgba(244,241,235,.12);padding:6px 24px 26px;overflow-x:auto}
.bg{display:grid;align-items:stretch;min-width:760px;max-width:1380px;margin:0 auto}
.bg>*{display:flex;align-items:center;min-height:46px}
.bh{font-size:10px;letter-spacing:.16em;text-transform:uppercase;justify-content:center;text-align:center;line-height:1.35;opacity:.65;background:none;border:0;color:inherit;padding:14px 6px}
.bh:hover,.bh.on{opacity:1}
.bh.on{box-shadow:inset 0 -1px 0 var(--ivory)}
.bl{background:none;border:0;color:inherit;font:300 24px var(--serif);text-align:left;padding:0 10px 0 0;opacity:.7;justify-content:flex-start}
.bl:hover,.bl.on{opacity:1}
.bl.on:before{content:"";width:18px;height:1px;background:var(--ivory);margin-right:10px}
.bl.all{font:500 10px var(--sans);letter-spacing:.2em;text-transform:uppercase}
.bc{justify-content:center;background:none;border:0;border-top:1px solid rgba(244,241,235,.1);color:inherit;font:300 22px var(--serif);flex-direction:column;gap:0;line-height:1.1}
.bc small{font:400 9px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#e29a93;min-height:11px}
.bc:hover{background:rgba(244,241,235,.07)}
.bc.on{background:var(--ivory);color:var(--black)}
.bc.on small{color:var(--red)}
.bc.none{opacity:.25;pointer-events:none}
.bs{border-top:1px solid rgba(244,241,235,.1)}
/* main */
main{max-width:1380px;margin:0 auto;padding:36px 24px 120px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.top h1{font:300 46px/1.1 var(--serif);margin:0}
.top small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);margin-bottom:8px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools input[type=search]{border:1px solid var(--sand);background:var(--paper);padding:11px 14px;width:240px;font:inherit;outline:0}
.tools input[type=search]:focus{border-color:var(--ink)}
.chips{display:flex}
.chips button{border:1px solid var(--sand);background:none;padding:10px 16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-left:-1px}
.chips button.on{background:var(--black);color:var(--ivory);border-color:var(--black)}
.grp{margin-bottom:44px}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:0}
.gh h2{font:400 30px var(--serif);margin:0;cursor:pointer}
.gh h2 em{font:400 11px var(--sans);font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);margin-left:14px}
.gh button{background:none;border:1px solid var(--sand);padding:8px 14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.gh button:hover{border-color:var(--ink)}
.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--sand);border-top:0}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font:500 10px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--taupe);text-align:left;padding:12px 14px;border-bottom:1px solid var(--sand);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #ECE7DD;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.dirty td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
tr.off .nm input,tr.off .th{opacity:.45}
tr:hover td{background:#F7F4EE}
.th{width:54px;height:54px;background:var(--sand);display:grid;place-items:center;overflow:hidden;color:var(--taupe);font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background-size:cover;background-position:center}
.nm input{border:1px solid transparent;background:none;font:400 19px var(--serif);width:100%;min-width:200px;padding:4px 6px;margin-left:-6px}
.nm input:hover{border-color:var(--sand)}.nm input:focus{border-color:var(--ink);background:#fff;outline:0}
.nm small{display:block;color:var(--taupe);font-size:10px;letter-spacing:.06em;padding-left:0}
.pr{display:flex;align-items:center;gap:4px;font:400 17px var(--serif)}
.pr input{border:1px solid transparent;background:none;font:400 17px var(--serif);width:76px;padding:4px 6px}
.pr input:hover{border-color:var(--sand)}.pr input:focus{border-color:var(--ink);background:#fff;outline:0}
.tg{width:34px;height:34px;display:grid;place-items:center;border:1px solid;background:none;font-size:16px;line-height:1}
.tg.on{background:var(--forest);border-color:var(--forest);color:#fff}
.tg.no{border-color:var(--red);color:var(--red)}
.cp{display:flex;gap:6px;flex-wrap:wrap}
.cp span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--sand);padding:3px 8px;color:var(--taupe)}
.cp span.y{border-color:var(--forest);color:var(--forest)}
.ed{background:none;border:1px solid var(--ink);padding:8px 14px;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.ed:hover{background:var(--black);color:var(--ivory)}
.sb{font-size:11px;color:var(--taupe)}
.empty{padding:34px;text-align:center;color:var(--taupe)}
/* drawer */
#sh{position:fixed;inset:0;background:rgba(17,18,17,.45);z-index:40;display:none}
#sh.on{display:block}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--ivory);z-index:41;transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column}
#dr.on{transform:none}
.dh{background:var(--black);color:var(--ivory);padding:22px 28px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dh small{letter-spacing:.2em;text-transform:uppercase;font-size:10px;opacity:.6}
.dh h3{font:300 28px/1.15 var(--serif);margin:6px 0 0}
.dh button{background:none;border:0;color:inherit;font-size:22px;line-height:1;padding:4px}
.db{flex:1;overflow:auto;padding:24px 28px 40px}
.fl{margin-bottom:20px}
.fl label{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe);margin-bottom:7px}
.fl input,.fl textarea,.fl select{width:100%;border:1px solid var(--sand);background:var(--paper);padding:11px 13px;font:inherit;outline:0}
.fl textarea{min-height:92px;resize:vertical}
.fl input:focus,.fl textarea:focus,.fl select:focus{border-color:var(--ink)}
.fl small{display:block;color:var(--taupe);font-size:11px;margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ph{display:flex;gap:16px;align-items:center}
.ph .th{width:96px;height:96px}
.ph div button{display:block;margin-bottom:8px}
.df{border-top:1px solid var(--sand);padding:16px 28px;display:flex;gap:12px;justify-content:space-between;background:var(--paper)}
.df .l{color:var(--red);border-color:var(--red)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--black);color:var(--ivory);padding:14px 24px;font-size:12px;letter-spacing:.08em;z-index:60;display:none;max-width:90vw}
#toast.on{display:block}
#toast.bad{background:var(--red)}
#ld{padding:90px;text-align:center;color:var(--taupe);letter-spacing:.2em;text-transform:uppercase;font-size:11px}
@media(max-width:900px){.cc{display:none}table{min-width:0}td,th{padding:8px 6px}.th{width:44px;height:44px}.nm input{min-width:0;font-size:17px}.pr input{width:58px}.ed{padding:8px 10px}.gh h2{font-size:24px}header{gap:10px;padding:0 12px;height:auto;min-height:64px;flex-wrap:wrap}nav{order:3;width:100%;margin:0;height:46px;justify-content:space-between}nav button{padding:0 6px}nav button.on:after{left:6px;right:6px;bottom:8px}.logo i,.hr a,.hr .who{display:none}.top h1{font-size:34px}main{padding:24px 12px 100px}.row2{grid-template-columns:1fr}}

.gl{border:1px solid transparent;background:none;font:400 30px var(--serif);color:var(--ink);padding:0 6px;margin-left:-6px;min-width:120px;max-width:60vw}
.gl:hover{border-color:var(--sand)}.gl:focus{border-color:var(--ink);background:#fff;outline:0}
.gh .gb{display:flex;gap:8px;align-items:center}.gh .gb button{white-space:nowrap}
.gh .gb button.rd{border-color:var(--red);color:var(--red)}
.gh .gb button.rd[disabled]{opacity:.35;cursor:default}
.gh .gb button.rd:not([disabled]):hover{background:var(--red);color:#fff}
.gh h2.pl{cursor:default}
.sq{width:30px;height:30px;border:1px solid var(--taupe);background:#fff;display:grid;place-items:center;color:transparent;font-size:15px;line-height:1;padding:0}
.sq:hover{border-color:var(--ink)}
.sq.on{border-color:var(--red);color:var(--red)}
th.sc{width:46px}
.hbtn{background:none;border:0;color:var(--ivory);font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:0 14px;height:72px;opacity:.7;position:relative}
.hbtn:hover,.hbtn.on{opacity:1}
.hbtn.on:after{content:"";position:absolute;left:14px;right:14px;bottom:18px;height:1px;background:var(--ivory)}
.hmid{display:flex;margin:0 auto}
.bl.all,.oh{cursor:pointer}
button.oh{background:none;border:0;color:inherit;text-align:left;padding:0;display:flex;align-items:center;gap:8px}
button.oh .ar{opacity:.7;font-size:14px;letter-spacing:0;margin-left:2px}
.mdl{position:fixed;inset:0;background:rgba(17,18,17,.55);z-index:50;display:none;place-items:center;padding:20px}
.mdl.on{display:grid}
.mdb{background:var(--ivory);width:min(440px,100%);padding:30px}
.mdb h3{font:300 30px var(--serif);margin:0 0 20px}
.mdb .df2{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.tile{background:var(--paper);border:1px solid var(--sand);padding:16px 18px}
.tile b{display:block;font:300 36px/1 var(--serif)}
.tile span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--taupe)}
.tile.warn b{color:var(--red)}
.st{font-size:10px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--sand);padding:4px 9px;white-space:nowrap}
.st.Lead{border-color:var(--gold);color:#8a6f33}.st.Customer{border-color:var(--forest);color:var(--forest)}.st.VIP{background:var(--black);color:var(--ivory);border-color:var(--black)}.st.Contacted{border-color:var(--taupe)}.st.Inactive{color:var(--taupe)}
.due{color:var(--red)}
.note{background:var(--paper);border:1px solid var(--sand);padding:16px 18px;max-width:640px;margin-bottom:22px;color:var(--taupe)}
.note b{color:var(--ink)}
.log{border-top:1px solid var(--sand);margin-top:6px}
.log div{padding:10px 0;border-bottom:1px solid #ECE7DD;font-size:13px}
.log small{color:var(--taupe);display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:900px){.tiles{grid-template-columns:1fr 1fr}.hbtn{height:46px;padding:0 8px}.hmid{order:3;width:100%;justify-content:center}.row3{grid-template-columns:1fr}}

.shell{display:flex;align-items:flex-start}
#side{width:236px;flex:none;position:sticky;top:72px;height:calc(100vh - 72px);overflow-y:auto;background:var(--paper);border-right:1px solid var(--sand);padding:18px 0 40px;display:block;margin:0;gap:0}
.cont{flex:1;min-width:0}
.sg{font:500 9px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--taupe);padding:22px 24px 6px}
button.si{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;border-left:2px solid transparent;text-align:left;padding:9px 20px 9px 22px;font:400 19px var(--serif);color:var(--ink);opacity:.72;height:auto;letter-spacing:0;text-transform:none}
button.si:hover{opacity:1;background:#F4F1EB}
button.si.on{opacity:1;border-left-color:var(--black);background:var(--ivory)}
button.si i{font:400 10px var(--sans);letter-spacing:.14em;color:var(--taupe);margin-right:10px;font-style:normal}
button.si b{font:500 10px var(--sans);min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;display:inline-grid;place-items:center;padding:0 6px}
button.si b.dot{background:none;color:var(--gold);font-size:22px;line-height:1}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--sand);margin:-8px 0 26px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--sand);padding:24px 26px;margin-bottom:22px}
.card h3{font:400 26px var(--serif);margin:0 0 4px}.card .sub{color:var(--taupe);font-size:12px;margin-bottom:16px;min-height:4px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}.two>.card{min-width:0}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.st.g{border-color:var(--forest);color:var(--forest)}.st.y{border-color:var(--gold);color:#8a6f33}.st.r{border-color:var(--red);color:var(--red)}.st.k{background:var(--black);color:var(--ivory);border-color:var(--black)}.st.n{color:var(--taupe)}
button.al,div.al{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;border-top:1px solid #ECE7DD;padding:13px 2px;text-align:left}
button.al{cursor:pointer}button.al:hover{background:#F7F4EE}
.al b{font:300 28px var(--serif);min-width:34px}.al span{flex:1}.al i{font-style:normal;color:var(--taupe)}
.ck{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #ECE7DD;color:var(--taupe)}
.ck u{width:22px;height:22px;border:1px solid var(--taupe);display:grid;place-items:center;text-decoration:none;font-size:13px}
.ck.ok{color:var(--ink)}.ck.ok u{background:var(--forest);border-color:var(--forest);color:#fff}
.hb>div{display:grid;grid-template-columns:minmax(90px,200px) 1fr auto;gap:12px;align-items:center;padding:6px 0;font-size:13px}
.hb i{height:10px;background:#ECE7DD;display:block}.hb u{display:block;height:100%;background:var(--forest)}.hb b{font-weight:500}
.vb{display:flex;align-items:flex-end;gap:14px;height:190px;padding-top:10px}
.vb>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;color:var(--taupe)}
.vb u{width:100%;max-width:70px;background:var(--forest);display:block}.vb b{font:400 12px var(--sans);color:var(--ink)}
.mi{border:1px solid transparent;background:none;font:inherit;padding:6px 8px;width:110px}.mi.n{width:84px}
.mi:hover{border-color:var(--sand)}.mi:focus{border-color:var(--ink);background:#fff;outline:0}
@media(max-width:900px){.shell{display:block}#side{position:static;width:auto;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--sand);padding:0}.sg{display:none}button.si{width:auto;white-space:nowrap;font-size:16px;padding:12px 14px;border-left:0;border-bottom:2px solid transparent}button.si.on{border-bottom-color:var(--black)}button.si i{display:none}.two,.fg{grid-template-columns:1fr}.vb{gap:6px}}
.gtb{background:none;border:1px solid var(--sand);padding:6px 10px;font:500 9px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--taupe);margin-left:12px;align-self:center}.gtb:hover{border-color:var(--ink);color:var(--ink)}
.lgg{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.lgg .wide{grid-column:1/-1}
.lgr{border-top:1px solid #ECE7DD;padding:16px 0}.lgt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.lgx{margin-left:auto;display:flex;gap:8px;align-items:center}
.lgl{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:8px 0}.lgk{font:600 11px var(--sans);letter-spacing:.14em;color:var(--taupe)}
.lgd{color:var(--taupe);font-size:12px;margin-top:4px}.lga{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lged textarea{width:100%;min-height:340px;font:12.5px/1.6 ui-monospace,Menlo,monospace;padding:14px;border:1px solid var(--sand);background:#fff;box-sizing:border-box}

var LGD={"kvkk":{"t":{"tr":"KVKK Aydınlatma Metni","en":"Privacy Notice (KVKK)"},"tr":"6698 sayılı Kişisel Verilerin Korunması Kanunu (\"KVKK\") m.10 ve Aydınlatma Yükümlülüğünün Yerine Getirilmesinde Uyulacak Usul ve Esaslar Hakkında Tebliğ uyarınca, kişisel verilerinizin hangi kapsamda işlendiğini aşağıda bilgilerinize sunarız.\n\n## 1. Veri sorumlusu\n- Unvan: {{name}} (\"{{brand}}\")\n- Adres: {{address}}\n- MERSİS no: {{mersis}}\n- E-posta: {{kvkkEmail}}\n- KEP adresi: {{kep}}\n\n## 2. İşlenen kişisel veriler\n- Kimlik bilgileri: ad, soyad.\n- İletişim bilgileri: e-posta adresi, telefon numarası, teslimat ve fatura adresi.\n- Müşteri işlem bilgileri: sipariş, sepet, ödeme durumu, iade, değişim ve talep kayıtları. Kart bilgileriniz tarafımızca saklanmaz; ödeme kuruluşu tarafından işlenir.\n- İşlem güvenliği bilgileri: IP adresi, cihaz ve tarayıcı bilgisi, oturum kayıtları.\n- Pazarlama bilgileri: yalnızca onay vermeniz halinde tercihleriniz ve kampanya etkileşimleriniz.\n- Çerez verileri: Çerez Politikası'nda açıklanan kapsamda.\n\n## 3. Kişisel verilerin işlenme amaçları\n- Siparişinizin alınması, onaylanması, hazırlanması, teslim edilmesi ve faturalandırılması.\n- Cayma, iade, değişim ve satış sonrası taleplerinin yürütülmesi.\n- Müşteri ilişkilerinin yönetimi ve sorularınızın yanıtlanması.\n- Sitenin güvenliğinin ve doğru çalışmasının sağlanması, hile ve kötüye kullanımın önlenmesi.\n- Yasal yükümlülüklerin (vergi, muhasebe, tüketici mevzuatı) yerine getirilmesi.\n- Onay vermeniz halinde ticari elektronik ileti gönderilmesi ve kampanya, tanıtım faaliyetlerinin yürütülmesi.\n- Onay vermeniz halinde sitenin kullanımının analiz edilmesi ve geliştirilmesi.\n\n## 4. İşlemenin hukuki sebepleri\nKişisel verileriniz KVKK m.5/2 kapsamında; sözleşmenin kurulması veya ifasıyla doğrudan ilgili olması (c), veri sorumlusunun hukuki yükümlülüğünü yerine getirmesi (ç), bir hakkın tesisi, kullanılması veya korunması (e) ve ilgili kişinin temel hak ve özgürlüklerine zarar vermemek kaydıyla veri sorumlusunun meşru menfaati (f) hukuki sebeplerine dayanılarak işlenir. Ticari ileti ve isteğe bağlı çerezler gibi faaliyetler yalnızca açık rızanıza dayanır ve rızanızı dilediğiniz zaman geri alabilirsiniz.\n\n## 5. Kişisel verilerin toplanma yöntemi\nVerileriniz web sitemiz, sipariş ve hesap formları, e-posta ve iletişim kanalları, çerezler ve benzeri teknolojiler aracılığıyla otomatik veya kısmen otomatik yollarla toplanır.\n\n## 6. Kişisel verilerin aktarılması\nVerileriniz, yukarıdaki amaçlarla sınırlı olarak ve KVKK m.8 ve m.9 hükümlerine uygun şekilde; kargo ve lojistik firmalarına, ödeme kuruluşlarına, e-ticaret, barındırma ve bilişim altyapısı sağlayıcılarına, muhasebe, mali müşavirlik ve hukuk danışmanlarına ve mevzuat gereği yetkili kamu kurum ve kuruluşlarına aktarılabilir. Altyapı sağlayıcılarımızın bir kısmı yurt dışında bulunabilir; bu durumda aktarım KVKK m.9 şartlarına uygun olarak yapılır.\n\n## 7. Saklama süresi\nKişisel verileriniz, işlenme amacının gerektirdiği ve ilgili mevzuatta öngörülen süre boyunca saklanır; sürenin dolmasının ardından silinir, yok edilir veya anonim hale getirilir.\n\n## 8. KVKK m.11 kapsamındaki haklarınız\n- Kişisel verilerinizin işlenip işlenmediğini öğrenme,\n- İşlenmişse buna ilişkin bilgi talep etme,\n- İşlenme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme,\n- Yurt içinde veya yurt dışında aktarıldığı üçüncü kişileri bilme,\n- Eksik veya yanlış işlenmişse düzeltilmesini isteme,\n- KVKK m.7 çerçevesinde silinmesini veya yok edilmesini isteme ve bunun aktarılan üçüncü kişilere bildirilmesini isteme,\n- İşlenen verilerin otomatik sistemlerle analiz edilmesi suretiyle aleyhinize bir sonuç doğmasına itiraz etme,\n- Kanuna aykırı işleme nedeniyle zarara uğramanız halinde zararın giderilmesini talep etme.\n\n## 9. Başvuru yöntemi\nHaklarınıza ilişkin taleplerinizi, kimliğinizi tespit edici bilgilerle birlikte yazılı olarak yukarıdaki adresimize, KEP adresimize veya {{kvkkEmail}} e-posta adresine iletebilirsiniz. Başvurunuz, talebin niteliğine göre en geç otuz gün içinde sonuçlandırılır. Başvurunuzun cevabından memnun kalmamanız halinde Kişisel Verileri Koruma Kurulu'na şikâyet hakkınız saklıdır.\n\nSon güncelleme: {{date}}","en":"This notice explains how your personal data is processed, in accordance with Article 10 of the Turkish Personal Data Protection Law No. 6698 (\"KVKK\") and the related communiqué on disclosure obligations.\n\n## 1. Data controller\n- Company: {{name}} (\"{{brand}}\")\n- Address: {{address}}\n- MERSIS no.: {{mersis}}\n- Email: {{kvkkEmail}}\n- Registered electronic mail (KEP): {{kep}}\n\n## 2. Personal data we process\n- Identity: first and last name.\n- Contact: email address, phone number, delivery and billing address.\n- Customer transactions: orders, basket, payment status, returns, exchanges and requests. We do not store your card details; they are processed by the payment provider.\n- Transaction security: IP address, device and browser information, session records.\n- Marketing: only if you give consent, your preferences and campaign interactions.\n- Cookie data: as described in the Cookie Policy.\n\n## 3. Purposes of processing\n- Receiving, confirming, preparing, delivering and invoicing your order.\n- Handling withdrawals, returns, exchanges and after-sales requests.\n- Managing customer relations and answering your questions.\n- Keeping the site secure and working properly, and preventing fraud and misuse.\n- Meeting legal obligations (tax, accounting, consumer law).\n- With your consent, sending commercial electronic messages and running campaigns.\n- With your consent, analysing and improving the use of the site.\n\n## 4. Legal grounds\nYour data is processed under Article 5/2 of the KVKK on the grounds that it is directly related to the conclusion or performance of a contract (c), necessary to comply with a legal obligation (ç), necessary for the establishment, exercise or protection of a right (e), and necessary for our legitimate interests provided your fundamental rights are not harmed (f). Activities such as commercial messages and optional cookies rely solely on your explicit consent, which you can withdraw at any time.\n\n## 5. How data is collected\nYour data is collected through our website, order and account forms, email and other communication channels, cookies and similar technologies, by automated or partly automated means.\n\n## 6. Transfers\nLimited to the purposes above and in line with Articles 8 and 9 of the KVKK, your data may be shared with carriers and logistics companies, payment institutions, e-commerce, hosting and IT infrastructure providers, accountants and legal advisers, and authorised public bodies where the law requires. Some of our infrastructure providers may be located abroad; in that case transfers are made in compliance with Article 9 of the KVKK.\n\n## 7. Retention\nYour data is kept for the period required by the purpose of processing and by the relevant legislation, and is then deleted, destroyed or anonymised.\n\n## 8. Your rights under Article 11\n- To learn whether your data is processed,\n- To request information if it has been processed,\n- To learn the purpose of processing and whether it is used accordingly,\n- To know the third parties to whom it is transferred at home or abroad,\n- To request correction if it is incomplete or inaccurate,\n- To request deletion or destruction under Article 7 and to have this notified to third parties,\n- To object to a result against you arising from analysis by automated systems,\n- To claim compensation for damage caused by unlawful processing.\n\n## 9. How to apply\nSend your requests with identifying information in writing to our address above, to our KEP address or to {{kvkkEmail}}. We respond within thirty days at the latest, depending on the nature of the request. If you are not satisfied with the answer, you may complain to the Personal Data Protection Board.\n\nLast updated: {{date}}"},"cookies":{"t":{"tr":"Çerez Politikası","en":"Cookie Policy"},"tr":"Bu politika, {{website}} adresinde çerez ve benzeri teknolojilerin nasıl kullanıldığını açıklar. Zorunlu çerezler dışındaki çerezler yalnızca açık onayınızla etkinleştirilir.\n\n## 1. Çerez nedir?\nÇerezler, bir web sitesini ziyaret ettiğinizde cihazınıza kaydedilen küçük metin dosyalarıdır. Benzer işlevler için tarayıcı depolama alanı gibi teknolojiler de kullanılabilir.\n\n## 2. Hangi çerezleri kullanıyoruz?\n- **Kesinlikle gerekli:** Sepetinizi, dilinizi, para biriminizi ve çerez tercihinizi hatırlar, sitenin güvenliğini sağlar. Bu çerezler olmadan site çalışamaz, bu nedenle her zaman açıktır.\n- **Reklam ve pazarlama:** Size uygun tekliflerin gösterilmesini ve kampanyalarımızın performansının ölçülmesini sağlar. Yalnızca onayınızla çalışır.\n- **Performans ve analitik:** Hangi sayfaların ziyaret edildiğini anlamamıza ve siteyi geliştirmemize yardımcı olur. Yalnızca onayınızla çalışır.\n- **İşlevsel:** Kayıtlı tercihler ve kişiselleştirilmiş özellikler gibi isteğe bağlı seçimlerinizi hatırlar. Yalnızca onayınızla çalışır.\n\n## 3. Hukuki dayanak\nKesinlikle gerekli çerezler, hizmetin sunulması için zorunlu olduğundan KVKK m.5/2 kapsamında işlenir. Diğer çerezler açık rızanıza dayanır.\n\n## 4. Tercihlerinizi yönetme\nSitemizi ilk ziyaretinizde sunulan çerez penceresinden tercihinizi belirleyebilirsiniz. Tercihlerinizi dilediğiniz zaman sayfanın altındaki \"Çerez ayarları\" bağlantısından değiştirebilir veya rızanızı geri alabilirsiniz. Ayrıca tarayıcınızın ayarlarından çerezleri silebilir veya engelleyebilirsiniz; bu durumda sitenin bazı bölümleri çalışmayabilir.\n\n## 5. Saklama süresi\nÇerez tercihiniz cihazınızda saklanır ve tercihinizi değiştirmediğiniz sürece yeniden sorulmaz. Diğer çerezlerin süresi türüne göre oturum süresiyle sınırlıdır veya ilgili sağlayıcının belirttiği süre kadardır.\n\n## 6. İletişim\nKişisel verilerinizin işlenmesine ilişkin ayrıntılar için KVKK Aydınlatma Metni'ne bakabilir, sorularınız için {{email}} adresine yazabilirsiniz.\n\nSon güncelleme: {{date}}","en":"This policy explains how cookies and similar technologies are used on {{website}}. Cookies other than strictly necessary ones are enabled only with your explicit consent.\n\n## 1. What are cookies?\nCookies are small text files saved on your device when you visit a website. Similar technologies, such as browser storage, may be used for comparable purposes.\n\n## 2. Which cookies do we use?\n- **Strictly necessary:** Remember your cart, language, currency and cookie choice, and keep the site secure. The site cannot work without them, so they are always on.\n- **Advertising and marketing:** Let us show relevant offers and measure how our campaigns perform. Active only with your consent.\n- **Performance and analytics:** Help us understand which pages are visited so we can improve the site. Active only with your consent.\n- **Functional:** Remember optional choices such as saved preferences and personalised features. Active only with your consent.\n\n## 3. Legal basis\nStrictly necessary cookies are processed under Article 5/2 of the KVKK because they are required to provide the service. All other cookies rely on your explicit consent.\n\n## 4. Managing your choices\nYou can set your choice in the cookie window shown on your first visit. You can change it or withdraw consent at any time through the \"Cookie settings\" link at the bottom of the page. You can also delete or block cookies in your browser settings; some parts of the site may then stop working.\n\n## 5. Retention\nYour cookie choice is stored on your device and you are not asked again until you change it. The lifetime of other cookies is limited to the session or to the period stated by the relevant provider, depending on the type.\n\n## 6. Contact\nFor details on how personal data is processed, see the Privacy Notice (KVKK). For questions, write to {{email}}.\n\nLast updated: {{date}}"},"privacy":{"t":{"tr":"Gizlilik Politikası","en":"Privacy Policy"},"tr":"{{brand}} olarak gizliliğinize saygı duyuyor ve kişisel verilerinizi yalnızca gerekli olduğu ölçüde ve açıkça belirtilen amaçlarla işliyoruz.\n\n## 1. Kapsam\nBu politika, {{website}} üzerinden yaptığınız ziyaretler, siparişler ve bizimle kurduğunuz iletişim için geçerlidir. Verilerin hangi hukuki sebeplerle, hangi amaçlarla ve kimlerle paylaşılarak işlendiğine ilişkin ayrıntılar KVKK Aydınlatma Metni'nde yer alır.\n\n## 2. Topladığımız bilgiler\nSipariş verirken veya bizimle iletişime geçerken ad, soyad, e-posta, telefon, teslimat ve fatura adresi gibi bilgileri sizden alırız. Siteyi kullanırken IP adresi, cihaz ve tarayıcı bilgisi gibi teknik bilgiler otomatik olarak işlenebilir.\n\n## 3. Bilgileri nasıl kullanırız\n- Siparişlerinizi almak, teslim etmek ve faturalandırmak,\n- İade, değişim ve destek taleplerinizi yanıtlamak,\n- Sitenin güvenliğini ve doğru çalışmasını sağlamak,\n- Yasal yükümlülüklerimizi yerine getirmek,\n- Yalnızca onayınızla haberler ve kampanyalar göndermek ve siteyi geliştirmek.\n\n## 4. Paylaşım\nKişisel verilerinizi satmayız. Verileriniz yalnızca hizmeti sunmak için gerekli olan kargo, ödeme, altyapı ve danışmanlık hizmeti sağlayıcılarıyla ve yasal olarak zorunlu olduğunda yetkili kurumlarla paylaşılır.\n\n## 5. Güvenlik\nVerilerinizi yetkisiz erişime, kayba ve kötüye kullanıma karşı korumak için makul teknik ve idari tedbirler uygularız. Ödeme bilgileriniz tarafımızca saklanmaz.\n\n## 6. Haklarınız\nKVKK m.11 kapsamındaki haklarınızı ve başvuru yöntemini KVKK Aydınlatma Metni'nde bulabilirsiniz. Taleplerinizi {{kvkkEmail}} adresine iletebilirsiniz.\n\n## 7. Değişiklikler\nBu politikayı zaman zaman güncelleyebiliriz. Güncel sürüm her zaman bu sayfada yayımlanır.\n\n## 8. İletişim\n{{name}}, {{address}} · {{email}} · {{phone}}\n\nSon güncelleme: {{date}}","en":"At {{brand}} we respect your privacy and process your personal data only as far as needed and for clearly stated purposes.\n\n## 1. Scope\nThis policy applies to your visits to {{website}}, your orders and your communication with us. The legal grounds, purposes and recipients of processing are detailed in the Privacy Notice (KVKK).\n\n## 2. Information we collect\nWhen you place an order or contact us we receive details such as your name, email, phone number, delivery and billing address. While you use the site, technical information such as IP address, device and browser details may be processed automatically.\n\n## 3. How we use it\n- To receive, deliver and invoice your orders,\n- To answer returns, exchange and support requests,\n- To keep the site secure and working properly,\n- To meet our legal obligations,\n- Only with your consent, to send news and campaigns and to improve the site.\n\n## 4. Sharing\nWe do not sell your personal data. It is shared only with carriers, payment, infrastructure and advisory providers needed to deliver the service, and with authorities when the law requires.\n\n## 5. Security\nWe apply reasonable technical and organisational measures to protect your data against unauthorised access, loss and misuse. We do not store your payment details.\n\n## 6. Your rights\nYou can find your rights under Article 11 of the KVKK and how to apply in the Privacy Notice (KVKK). You can send your requests to {{kvkkEmail}}.\n\n## 7. Changes\nWe may update this policy from time to time. The current version is always published on this page.\n\n## 8. Contact\n{{name}}, {{address}} · {{email}} · {{phone}}\n\nLast updated: {{date}}"},"terms":{"t":{"tr":"Kullanım Koşulları","en":"Terms of Use"},"tr":"Bu koşullar, {{website}} adresindeki web sitesinin (\"Site\") kullanımını düzenler. Siteyi kullanarak bu koşulları kabul etmiş sayılırsınız.\n\n## 1. Satıcı bilgileri\n- Unvan: {{name}} (\"{{brand}}\")\n- Adres: {{address}}\n- Vergi dairesi ve no: {{taxOffice}} · {{taxNo}}\n- MERSİS no: {{mersis}}\n- E-posta: {{email}} · Telefon: {{phone}}\n\n## 2. Site kullanımı\nSiteyi yalnızca hukuka uygun amaçlarla kullanmayı, sitenin işleyişini bozacak veya diğer kullanıcıların haklarını ihlal edecek işlemlerden kaçınmayı kabul edersiniz. Siteye yetkisiz erişim, otomatik veri toplama ve güvenlik önlemlerini aşma girişimleri yasaktır.\n\n## 3. Ürün bilgileri ve fiyatlar\nÜrün görselleri, açıklamaları ve fiyatları doğru olması için özen gösterilerek yayımlanır. Görseller ekran farklılıkları nedeniyle gerçek üründen küçük farklılıklar gösterebilir. Fiyatlar ve stok durumu önceden haber verilmeksızin değişebilir; siparişiniz onaylandığında geçerli olan fiyat uygulanır. Aroma ve içerik açıklamaları duyusal izlenimleri anlatır, tıbbi bir etki iddiası taşımaz. Ürünler tıbbi tedavi amaçlı değildir.\n\n## 4. Sipariş ve sözleşme\nSipariş vermeniz bir satın alma teklifidir. Siparişiniz tarafımızca onaylandığında satış sözleşmesi kurulmuş olur. Stok yetersizliği, fiyat hatası veya ödeme sorunu halinde siparişi iptal etme hakkımız saklıdır; bu durumda ödediğiniz tutar iade edilir. Mesafeli satış sözleşmesi ve cayma hakkına ilişkin ayrıntılar ilgili metinlerde yer alır.\n\n## 5. Fikri mülkiyet\nSitedeki tüm içerik, marka, logo, fotoğraf, metin ve tasarımlar {{name}}'e veya lisans verenlerine aittir. Yazılı izin olmadan kopyalanamaz, çoğaltılamaz veya ticari amaçla kullanılamaz.\n\n## 6. Sorumluluğun sınırı\nSite \"olduğu gibi\" sunulur. Kesintisiz veya hatasız çalışacağı garanti edilmez. Kanunun izin verdiği ölçüde, siteyi kullanmanızdan doğan dolaylı zararlardan sorumlu değiliz; tüketici mevzuatından doğan haklarınız saklıdır.\n\n## 7. Kişisel veriler\nKişisel verileriniz KVKK Aydınlatma Metni ve Gizlilik Politikası kapsamında işlenir.\n\n## 8. Uygulanacak hukuk ve uyuşmazlıklar\nBu koşullara Türk hukuku uygulanır. Tüketici işlemlerinde, yürürlükteki parasal sınırlar dahilinde yerleşim yerinizdeki veya işlem yaptığınız yerdeki Tüketici Hakem Heyetleri ve Tüketici Mahkemeleri yetkilidir.\n\n## 9. Değişiklikler\nBu koşulları güncelleme hakkımız saklıdır. Güncel sürüm bu sayfada yayımlanır.\n\nSon güncelleme: {{date}}","en":"These terms govern your use of the website at {{website}} (the \"Site\"). By using the Site you accept these terms.\n\n## 1. Seller information\n- Company: {{name}} (\"{{brand}}\")\n- Address: {{address}}\n- Tax office and no.: {{taxOffice}} · {{taxNo}}\n- MERSIS no.: {{mersis}}\n- Email: {{email}} · Phone: {{phone}}\n\n## 2. Use of the Site\nYou agree to use the Site only for lawful purposes and to avoid actions that disrupt it or violate other users' rights. Unauthorised access, automated data collection and attempts to bypass security measures are prohibited.\n\n## 3. Product information and prices\nProduct images, descriptions and prices are published with care to be accurate. Images may differ slightly from the actual product because of screen differences. Prices and availability may change without notice; the price valid when your order is confirmed applies. Aroma and ingredient descriptions describe sensory impressions and make no medical claims. Products are not intended for medical treatment.\n\n## 4. Orders and contract\nPlacing an order is an offer to buy. A sales contract is formed when we confirm your order. We may cancel an order in case of insufficient stock, pricing error or payment problems, in which case any amount paid is refunded. Details on distance sales and the right of withdrawal are in the relevant documents.\n\n## 5. Intellectual property\nAll content, brands, logos, photographs, texts and designs on the Site belong to {{name}} or its licensors. They may not be copied, reproduced or used commercially without written permission.\n\n## 6. Limitation of liability\nThe Site is provided \"as is\" and uninterrupted or error-free operation is not guaranteed. To the extent permitted by law we are not liable for indirect damages arising from your use of the Site; your rights under consumer legislation remain unaffected.\n\n## 7. Personal data\nYour personal data is processed under the Privacy Notice (KVKK) and the Privacy Policy.\n\n## 8. Governing law and disputes\nTurkish law applies to these terms. For consumer transactions, within the monetary limits in force, the Consumer Arbitration Committees and Consumer Courts at your place of residence or where the transaction was made are competent.\n\n## 9. Changes\nWe may update these terms. The current version is published on this page.\n\nLast updated: {{date}}"},"sales":{"t":{"tr":"Mesafeli Satış Sözleşmesi","en":"Distance Sales Agreement"},"tr":"Bu sözleşme, 6502 sayılı Tüketicinin Korunması Hakkında Kanun ve Mesafeli Sözleşmeler Yönetmeliği hükümlerine göre düzenlenmiştir. Sipariş verdiğinizde ön bilgilendirme ve bu sözleşme hakkında bilgilendirilmiş olursunuz.\n\n## 1. Taraflar\n**Satıcı:** {{name}} (\"{{brand}}\") · {{address}} · Vergi dairesi/no: {{taxOffice}} / {{taxNo}} · MERSİS: {{mersis}} · E-posta: {{email}} · Telefon: {{phone}} · KEP: {{kep}}\n\n**Alıcı:** Sipariş sırasında ad, soyad, adres ve iletişim bilgilerini bildiren kişi.\n\n## 2. Sözleşmenin konusu\nAlıcının {{website}} üzerinden sipariş ettiği ürünlerin satışı ve teslimi ile ilgili tarafların hak ve yükümlülükleri. Ürünlerin temel nitelikleri, adedi, vergiler dahil toplam fiyatı, ödeme şekli ve teslimat bilgileri sipariş özetinde yer alır.\n\n## 3. Teslimat\nÜrünler, alıcının bildirdiği adrese, sipariş onayından itibaren en geç otuz gün içinde teslim edilir. Teslimat ücretsiz kargo koşulları ve gönderim ücreti sipariş özetinde gösterilir. Teslimat, ürünün alıcıya veya alıcının belirttiği kişiye tesliminden ibarettir. Teslim sırasında paketin hasarlı olması halinde, hasar tespit tutanağı tutturularak kargo firmasına tesellüm edilmeden bildirilmelidir.\n\n## 4. Ödeme\nÖdeme, sipariş sırasında sunulan ödeme yöntemleriyle yapılır. Kart bilgileri tarafımızca saklanmaz.\n\n## 5. Cayma hakkı\nAlıcı, ürünün tesliminden itibaren on dört gün içinde herhangi bir gerekçe göstermeksizin ve cezai şart ödemeksizin sözleşmeden cayma hakkına sahiptir. Cayma bildirimi {{email}} adresine veya yukarıdaki adrese yapılabilir. Cayma hakkı kullanıldığında ürün, bildirimden itibaren on dört gün içinde kullanılmamış ve orijinal ambalajında geri gönderilir; ödenen tutar, cayma bildiriminin ulaşmasından itibaren en geç on dört gün içinde, ödeme için kullanılan yöntemle iade edilir.\n\n## 6. Cayma hakkının kullanılamayacağı haller\nYönetmelik uyarınca; ambalajı, bandı, mührü veya koruyucu unsurları açılmış, iadesi sağlık ve hijyen açısından uygun olmayan ürünlerde (örneğin açılmış yağ, sabun ve kozmetik ürünler), alıcının istekleri veya kişisel ihtiyaçları doğrultusunda hazırlanan ürünlerde ve kanunda sayılan diğer hallerde cayma hakkı kullanılamaz. Ayıplı ürünlerde alıcının yasal hakları saklıdır.\n\n## 7. Ayıplı ürün\nTeslim edilen ürünün ayıplı olması halinde alıcı, 6502 sayılı Kanun'un 11. maddesinde sayılan seçimlik haklarını kullanabilir.\n\n## 8. Uyuşmazlıkların çözümü\nBu sözleşmeden doğan uyuşmazlıklarda, yürürlükteki parasal sınırlar dahilinde alıcının yerleşim yerindeki veya işlem yaptığı yerdeki Tüketici Hakem Heyetleri ve Tüketici Mahkemeleri yetkilidir.\n\n## 9. Yürürlük\nAlıcı, siparişi onaylayarak bu sözleşmenin ve ön bilgilendirmenin tüm içeriğini okuduğunu ve elektronik ortamda kabul ettiğini beyan eder.\n\nSon güncelleme: {{date}}","en":"This agreement is prepared under Law No. 6502 on Consumer Protection and the Regulation on Distance Contracts. When you place an order you are informed of the pre-contract information and of this agreement.\n\n## 1. Parties\n**Seller:** {{name}} (\"{{brand}}\") · {{address}} · Tax office/no.: {{taxOffice}} / {{taxNo}} · MERSIS: {{mersis}} · Email: {{email}} · Phone: {{phone}} · KEP: {{kep}}\n\n**Buyer:** The person who provides their name, address and contact details when ordering.\n\n## 2. Subject\nThe sale and delivery of the products the buyer orders on {{website}}, and the rights and obligations of the parties. The main features, quantity, total price including taxes, payment method and delivery details appear in the order summary.\n\n## 3. Delivery\nProducts are delivered to the address given by the buyer within thirty days of order confirmation at the latest. Free shipping conditions and the shipping fee are shown in the order summary. If the package is damaged on delivery, a damage report must be drawn up and reported to the carrier before accepting it.\n\n## 4. Payment\nPayment is made with the payment methods offered at checkout. We do not store card details.\n\n## 5. Right of withdrawal\nThe buyer may withdraw from the contract within fourteen days of receiving the product, without giving any reason and without penalty. Notice can be sent to {{email}} or to the address above. When withdrawal is exercised, the product must be sent back unused and in its original packaging within fourteen days of the notice; the amount paid is refunded using the original payment method within fourteen days of receiving the withdrawal notice at the latest.\n\n## 6. Exceptions to the right of withdrawal\nUnder the Regulation, there is no right of withdrawal for products whose packaging, tape, seal or protective elements have been opened and which are unsuitable for return for health and hygiene reasons (for example opened oils, soaps and cosmetics), for products made to the buyer's specifications or personal needs, and for other cases listed in the law. The buyer's statutory rights regarding defective products remain unaffected.\n\n## 7. Defective products\nIf a delivered product is defective, the buyer may use the optional rights listed in Article 11 of Law No. 6502.\n\n## 8. Dispute resolution\nFor disputes arising from this agreement, within the monetary limits in force, the Consumer Arbitration Committees and Consumer Courts at the buyer's place of residence or where the transaction was made are competent.\n\n## 9. Effect\nBy confirming the order, the buyer declares that they have read and electronically accepted this agreement and the pre-contract information in full.\n\nLast updated: {{date}}"},"returns":{"t":{"tr":"İade ve Değişim","en":"Returns & Exchanges"},"tr":"Siparişinizden memnun kalmanız bizim için önemlidir. İade ve değişim koşulları aşağıdadır.\n\n## 1. İade süresi\nÜrünü teslim aldığınız tarihten itibaren on dört gün içinde, herhangi bir gerekçe göstermeksizin iade edebilirsiniz.\n\n## 2. İade koşulları\n- Ürün kullanılmamış, hasarsız ve orijinal ambalajında olmalıdır.\n- Fatura veya sipariş numarası ile birlikte gönderilmelidir.\n- Hijyen ve sağlık nedeniyle, ambalajı, mührü veya koruyucu unsuru açılmış yağ, sabun ve benzeri bakım ürünleri iade edilemez.\n- Sizin isteğinize göre kişiselleştirilmiş ürünler iade edilemez.\n\n## 3. İade nasıl yapılır?\n1. {{email}} adresine sipariş numaranızı belirterek iade talebinizi iletin.\n2. Size iade gönderim talimatını yanıtlayacağız.\n3. Ürünü talimata uygun şekilde paketleyerek gönderin.\n\n## 4. Geri ödeme\nÜrün bize ulaşıp kontrol edildikten sonra, tutar ödeme için kullandığınız yöntemle iade edilir. Geri ödeme, cayma bildiriminizin tarafımıza ulaşmasından itibaren en geç on dört gün içinde yapılır. Bankanıza bağlı olarak tutarın hesabınıza yansıması birkaç iş günü sürebilir.\n\n## 5. Değişim\nÜrün değişimi için iade sürecini izleyip yeni siparişinizi verebilir ya da {{email}} adresinden bize yazabilirsiniz. Stok durumuna göre değişimde size yardımcı oluruz.\n\n## 6. Hasarlı veya hatalı ürün\nÜrününüz hasarlı veya hatalı geldiyse, teslim tarihinden itibaren en kısa sürede fotoğraflarla birlikte bize yazın. Ayıplı ürünlerde yasal haklarınız saklıdır ve gönderim masrafını biz karşılarız.\n\n## 7. İletişim\n{{name}} · {{email}} · {{phone}}\n\nSon güncelleme: {{date}}","en":"Your satisfaction with your order matters to us. The returns and exchange terms are below.\n\n## 1. Return period\nYou may return a product within fourteen days of receiving it, without giving any reason.\n\n## 2. Conditions\n- The product must be unused, undamaged and in its original packaging.\n- It must be sent together with the invoice or order number.\n- For hygiene and health reasons, oils, soaps and similar care products whose packaging, seal or protective element has been opened cannot be returned.\n- Products personalised at your request cannot be returned.\n\n## 3. How to return\n1. Email your return request to {{email}} with your order number.\n2. We will reply with return shipping instructions.\n3. Pack the product as instructed and send it back.\n\n## 4. Refund\nOnce the product reaches us and has been checked, the amount is refunded using the payment method you used. The refund is made within fourteen days of your withdrawal notice reaching us at the latest. Depending on your bank, it may take a few business days to appear in your account.\n\n## 5. Exchanges\nTo exchange a product, follow the return process and place a new order, or write to us at {{email}}. We will help with exchanges depending on stock.\n\n## 6. Damaged or incorrect products\nIf your product arrives damaged or incorrect, write to us with photos as soon as possible after delivery. Your statutory rights for defective products remain unaffected and we cover the shipping cost.\n\n## 7. Contact\n{{name}} · {{email}} · {{phone}}\n\nLast updated: {{date}}"},"shipping":{"t":{"tr":"Teslimat ve Kargo","en":"Shipping & Delivery"},"tr":"## 1. Kargo ücreti\n€250 ve üzeri siparişlerde kargo ücretsizdir; bunun altındaki siparişlerde gönderim ücreti €15'tir. Gümrük vergileri ve diğer vergiler varsa ödeme adımında gösterilir.\n\n## 2. Hazırlık ve teslimat süresi\nSiparişleriniz onaylandıktan sonra özenle hazırlanır ve kargoya verilir. Tahmini teslimat süresi sipariş özetinde belirtilir. Her durumda teslimat, sipariş onayından itibaren en geç otuz gündür.\n\n## 3. Teslimat adresi\nSiparişin doğru teslim edilmesi için adres ve iletişim bilgilerinizi eksiksiz girmenizi rica ederiz. Hatalı veya eksik adres nedeniyle oluşan gecikmelerden ve ek maliyetlerden sorumlu değiliz.\n\n## 4. Takip\nSiparişiniz kargoya verildiğinde, takip numarasını içeren bir e-posta alırsınız.\n\n## 5. Hasarlı paket\nPaketi teslim alırken hasar fark ederseniz, kargo görevlisiyle birlikte hasar tespit tutanağı düzenleyin ve bize {{email}} adresinden bildirin.\n\n## 6. Teslim edilemeyen gönderiler\nAlıcıya ulaşılamaması veya teslimatın reddedilmesi halinde gönderi bize iade edilebilir. Bu durumda sizinle iletişime geçeriz.\n\n## 7. İletişim\nTeslimatla ilgili sorularınız için: {{email}} · {{phone}}\n\nSon güncelleme: {{date}}","en":"## 1. Shipping fee\nShipping is free on orders of €250 and over; below that, the shipping fee is €15. Duties and other taxes, if any, are shown at checkout.\n\n## 2. Preparation and delivery time\nOnce confirmed, your order is carefully prepared and handed to the carrier. The estimated delivery time is stated in the order summary. In any case delivery takes place within thirty days of order confirmation at the latest.\n\n## 3. Delivery address\nPlease enter your address and contact details completely so your order is delivered correctly. We are not responsible for delays or extra costs caused by an incorrect or incomplete address.\n\n## 4. Tracking\nWhen your order is handed to the carrier, you receive an email with the tracking number.\n\n## 5. Damaged package\nIf you notice damage when receiving the package, draw up a damage report with the courier and tell us at {{email}}.\n\n## 6. Undeliverable parcels\nIf the recipient cannot be reached or refuses delivery, the parcel may be returned to us. In that case we will contact you.\n\n## 7. Contact\nFor questions about delivery: {{email}} · {{phone}}\n\nLast updated: {{date}}"},"consent":{"t":{"tr":"Ticari Elektronik İleti ve Açık Rıza Metni","en":"Marketing Communications Consent"},"tr":"Bu metin, 6563 sayılı Elektronik Ticaretin Düzenlenmesi Hakkında Kanun ve KVKK kapsamında, ticari elektronik ileti ve pazarlama amaçlı veri işleme için açık rızanızı almak üzere hazırlanmıştır. Bu onay isteğe bağlıdır; vermemeniz halinde sipariş ve hizmetlerimizden yararlanmanız etkilenmez.\n\n## 1. Veri sorumlusu\n{{name}} (\"{{brand}}\") · {{address}} · {{kvkkEmail}}\n\n## 2. Onayınızın kapsamı\nBu onayı vermeniz halinde;\n- Yeni ürünler, kampanyalar, indirimler ve özel tekliflere ilişkin tanıtım ve pazarlama iletilerinin e-posta, kısa mesaj ve telefon aracılığıyla size gönderilmesi,\n- Alışveriş ve gezinme tercihlerinize göre size özel içerik ve tekliflerin sunulması,\n- Bu amaçlarla iletişim bilgilerinizin ve tercihlerinizin işlenmesi\n\nkonusunda açık rıza vermiş olursunuz.\n\n## 3. Rızanın geri alınması\nOnayınızı dilediğiniz zaman, hiçbir gerekçe göstermeksizin ve ücretsiz olarak geri alabilirsiniz. Her iletinin içinde yer alan \"abonelikten çık\" bağlantısını kullanabilir ya da {{email}} adresine yazabilirsiniz. Talebiniz en geç yedi iş günü içinde yerine getirilir.\n\n## 4. Kişisel verilerinizin korunması\nVerilerinizin işlenmesi, aktarılması ve haklarınız hakkında ayrıntılı bilgi KVKK Aydınlatma Metni'nde yer alır.\n\nSon güncelleme: {{date}}","en":"This text is prepared to obtain your explicit consent for commercial electronic messages and marketing-related data processing under Law No. 6563 on the Regulation of Electronic Commerce and the KVKK. This consent is optional; if you do not give it, your orders and use of our services are not affected.\n\n## 1. Data controller\n{{name}} (\"{{brand}}\") · {{address}} · {{kvkkEmail}}\n\n## 2. Scope of your consent\nBy giving this consent you agree to:\n- Receive promotional and marketing messages about new products, campaigns, discounts and special offers by email, text message and phone,\n- Be shown content and offers personalised to your shopping and browsing preferences,\n- Have your contact details and preferences processed for these purposes.\n\n## 3. Withdrawing consent\nYou can withdraw your consent at any time, without giving a reason and free of charge. Use the \"unsubscribe\" link in each message or write to {{email}}. Your request is carried out within seven business days at the latest.\n\n## 4. Protection of your data\nDetails on processing, transfers and your rights are in the Privacy Notice (KVKK).\n\nLast updated: {{date}}"}},LGO=Object.keys(LGD);
