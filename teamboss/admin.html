<style>

*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}
body{background:var(--ivory);color:var(--ink);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}

 var ch=groupSum(D.marketing,'channel','spent').map(function(x){var rv=sum(D.marketing.filter(function(c){return c.channel==x[0]}),'revenue');return [x[0]+' (spent '+eur(x[1])+')',rv]});
 h+='<div class="two"><div class="card"><h3>Marketing revenue by channel</h3><div class="sub"></div>'+hbars(ch,eur)+'</div><div class="card"><h3>Catalogue health</h3><div class="sub"></div>'+hbars(GO.map(function(g){return [GN[g]+' · online',P.filter(function(p){return p.g==g&&live(p)&&p.visible}).length]}).concat(GO.map(function(g){return [GN[g]+' · offline',P.filter(function(p){return p.g==g&&live(p)&&!p.visible}).length]})))+'</div></div>';
 return h};
